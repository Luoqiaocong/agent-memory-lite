[project]
name = "agent-memory-lite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luoqiaocong", email = "luoqiaocong@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.50",
]

[project.scripts]
agent-memory-lite = "agent_memory_lite:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
